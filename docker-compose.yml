services:
  handbook:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - handbook_data:/data
    expose:
      - "3000"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [handbook]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
volumes:
  handbook_data:
